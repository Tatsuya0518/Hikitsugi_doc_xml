[package]
name = "hikitsugi-doc-xml"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hikitsugi-doc-xml"
path = "src/main.rs"

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# XML / ZIP (for reading xlsx files which are ZIP archives)
quick-xml = "0.36"
zip = "2"

# Excel writing
rust_xlsxwriter = "0.68"

# Utilities
md5 = "0.7"
base64 = "0.22"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
